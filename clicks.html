<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>clicks</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <button class="btn btn-primary" id="btn1">Click Me</button>
    <button class="btn btn-info" id="btn2">Click Me</button>
    <input type="number" placeholder="Enter Weight" id="input">
    <h1 id="heading"></h1>
</div>

<script>
   const btn_1 = document.querySelector("#btn1")
    const heading = document.querySelector("#heading")

   const my_input = document.querySelector("#input")
   const btn2 =document.querySelector("#btn2")

   btn_1.addEventListener("click",()=>{
       // alert('Clicked')
       heading.textContent="Clicked"
       heading.classList.add("text-danger","text-center")
    })

   function squareListener(){
     let weight = my_input.value
     let result = weight * weight
     heading.textContent = `weight squared is ${result}`
   }

   btn2.addEventListener('click',squareListener)
// listeners
//    class and objects in js---inheritance
//    modules,install
//    node
//    webstorm
</script>

</body>
</html>
