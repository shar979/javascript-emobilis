//default parameters
function divide(a, b , rounded= false) {
    let res= a / b
    if (rounded=== true) {
        res = Math.round(res)
    }
    return res;
}

let res1 = divide(10, 3, true); // returns 3
let res2 = divide(10, 3); // returns 3.3333333333333335
console.log(res1, res2);

//spread operator - takes any number of arguments and puts them into an array
function flexibleAdd(...nums){
    let total = 0
    for (let num of nums) {
        total += num;
    }
    return total
}
console.log(flexibleAdd(1, 2, 3, 4, 5)); // returns 15
